name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and run tests
        run: make test CXX=clang++ PYTHON=python3 CXXFLAGS="-O2 -std=c++17 -Wall -Wextra -Wpedantic"
      - name: Verify the recorded 17-party examples independently
        run: |
          python3 verify_certificate.py examples/paper_verification/certificate.json
          python3 verify_certificate.py examples/search_17_10001/certificate.json
      - name: Check the launcher
        run: bash -n run.sh

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make sanitize CXX=clang++ PYTHON=python3
